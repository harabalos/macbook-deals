name: watch

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; runs can start a few minutes late
  workflow_dispatch:

# one check at a time; a run that is still going makes the next one wait
concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # the runner ships Google Chrome; download Playwright's Chromium only if it is missing
      - run: command -v google-chrome || python -m playwright install --with-deps chromium

      - name: Check stores and newsletters
        run: python watcher.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}

      # remember prices for the next run (also keeps the schedule from being paused for inactivity)
      - name: Save state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "macbook-deals-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -q -m "state: $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
